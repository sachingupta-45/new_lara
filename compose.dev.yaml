services:

  app:
    build:
      target: development

    # .env is read straight from the mounted project folder in dev.
    # Injecting it as container env vars would freeze values (e.g. an empty
    # APP_KEY) at container creation and override later edits to .env.
    env_file: !reset []

    volumes:
      - .:/var/www/html
      - ./storage:/var/www/html/storage
      - crm_vendor:/var/www/html/vendor

    networks:
      - crm_network
      - central_db_network

  nginx:
    volumes:
      - .:/var/www/html:ro
      - ./storage:/var/www/html/storage:ro

networks:
  central_db_network:
    external: true
    name: central_db_network

volumes:
  crm_vendor: