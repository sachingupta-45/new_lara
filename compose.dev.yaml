services:

  app:
    build:
      target: development

    volumes:
      - .:/var/www/html
      - ./storage:/var/www/html/storage
      - crm_vendor:/var/www/html/vendor

    networks:
      - crm_network
      - central_db_network

  nginx:
    volumes:
      - .:/var/www/html:ro
      - ./storage:/var/www/html/storage:ro

networks:
  central_db_network:
    external: true
    name: central_db_network

volumes:
  crm_vendor: